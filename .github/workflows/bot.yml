name: outage-bot

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

# Лише один запуск одночасно, щоб не дублювати сповіщення.
concurrency:
  group: outage-bot
  cancel-in-progress: false

permissions:
  contents: read
  actions: write # кеш стану + підтримка cron активним

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: bot-state-${{ github.run_id }}
          restore-keys: bot-state-

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python3 bot.py

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: bot-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Housekeeping
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # прибрати старі кеші стану (лишаємо 5 найновіших)
          gh cache list -R "$GITHUB_REPOSITORY" --key bot-state- --sort created_at --order desc -L 100 --json id -q '.[5:][].id' \
            | xargs -r -n1 gh cache delete -R "$GITHUB_REPOSITORY" || true
          # раз на добу «будимо» workflow, щоб GitHub не вимкнув cron через 60 днів без комітів
          if [ "$(date -u +%H)" = "03" ] && [ "$(date -u +%M)" -lt 10 ]; then
            gh workflow enable bot.yml -R "$GITHUB_REPOSITORY" || true
          fi
