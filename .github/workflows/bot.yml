name: outage-bot

# Бот працює безперервно: кожен запуск триває ~55 хв (long polling — миттєві відповіді
# на команди), на старті ставить у чергу наступний запуск, тож вони йдуть один за одним.
# Cron — лише страховка, якщо ланцюжок колись обірветься.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

# Лише один запуск одночасно; наступний чекає в черзі (pending), поки поточний не завершиться.
concurrency:
  group: outage-bot
  cancel-in-progress: false

permissions:
  contents: read
  actions: write # кеш стану, запуск наступного циклу, підтримка cron активним

env:
  LOOP_MINUTES: "55"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Queue next run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run bot.yml -R "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" || true

      - uses: actions/checkout@v4

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: bot-state-${{ github.run_id }}
          restore-keys: bot-state-

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python3 bot.py --loop "$LOOP_MINUTES"

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: bot-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Housekeeping
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # прибрати старі кеші стану (лишаємо 5 найновіших)
          gh cache list -R "$GITHUB_REPOSITORY" --key bot-state- --sort created_at --order desc -L 100 --json id -q '.[5:][].id' \
            | xargs -r -n1 gh cache delete -R "$GITHUB_REPOSITORY" || true
          # «будимо» workflow, щоб GitHub не вимкнув cron через 60 днів без комітів
          gh workflow enable bot.yml -R "$GITHUB_REPOSITORY" || true
